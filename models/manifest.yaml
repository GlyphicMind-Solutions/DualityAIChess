# Modify this file to fit your needs.  
# The model path should point to your model location.  
# Comment out or remove models you do not have or wish to use.  
# The "template" field determines which prompt template is injected.  

models:
  GPT:
    path: ./models/gpt-oss-20b-MXFP4.gguf
    n_ctx: 131072
    template: gpt

  Mistral:
    path: ./models/mistral-7b-instruct-v0.2.2.Q4_K_M.gguf
    n_ctx: 32768
    template: mistral

